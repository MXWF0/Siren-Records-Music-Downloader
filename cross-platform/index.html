<!doctype html>
<html lang="zh-CN">
  <head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="application-version" content="%APP_VERSION%" />
    <script>
      (() => {
        if (!/^https?:$/.test(location.protocol)) return;
        const currentVersion = '%APP_VERSION%';
        const versionKey = 'siren-records-web-version';
        const reloadKey = 'siren-records-version-reload';
        const currentUrl = new URL(location.href);
        const forcedVersion = currentUrl.searchParams.get('__app_version');

        if (forcedVersion === currentVersion) {
          currentUrl.searchParams.delete('__app_version');
          history.replaceState(null, '', `${currentUrl.pathname}${currentUrl.search}${currentUrl.hash}`);
        }

        const previousVersion = localStorage.getItem(versionKey);
        localStorage.setItem(versionKey, currentVersion);
        if (previousVersion && previousVersion !== currentVersion && sessionStorage.getItem(reloadKey) !== currentVersion) {
          sessionStorage.setItem(reloadKey, currentVersion);
          currentUrl.searchParams.set('__app_version', currentVersion);
          location.replace(currentUrl.href);
          return;
        }

        // Revalidate the tiny entry document once per session. Hashed assets remain cacheable.
        if (sessionStorage.getItem(reloadKey) === currentVersion) return;
        sessionStorage.setItem(reloadKey, currentVersion);
        fetch(new URL(location.pathname, location.origin), { cache: 'reload' })
          .then((response) => response.ok ? response.text() : '')
          .then((html) => {
            const match = html.match(/name=["']application-version["'] content=["']([^"']+)["']/);
            const latestVersion = match?.[1];
            if (!latestVersion || latestVersion === currentVersion) return;
            localStorage.setItem(versionKey, latestVersion);
            const target = new URL(location.href);
            target.searchParams.set('__app_version', latestVersion);
            location.replace(target.href);
          })
          .catch(() => undefined);
      })();
    </script>
    <script src="/runtime-config.js"></script>
    <script>
      function showStaticError(message) {
        const app = document.getElementById('app');
        if (!app) {
          window.addEventListener('DOMContentLoaded', () => showStaticError(message), { once: true });
          return;
        }
        if (app.childElementCount) return;
        app.innerHTML = `<main style="max-width:36rem;margin:16vh auto;padding:2rem;font:16px system-ui,sans-serif;line-height:1.7;color:#18395d;background:#fff;border:1px solid #d8e3ee;border-radius:16px;box-shadow:0 15px 40px rgba(33,58,85,.12)"><h1 style="margin:0 0 .6rem;font-size:1.35rem">页面加载失败</h1><p style="margin:0;color:#6c7f93">${message || '请确认已保留 dist 文件夹中的全部文件，然后重新打开 index.html。'}</p></main>`;
      }
      window.addEventListener('error', (event) => showStaticError(event.error?.message || event.message));
      window.addEventListener('unhandledrejection', (event) => showStaticError(event.reason?.message || '页面初始化失败'));
      if (location.protocol === 'file:' && !location.pathname.replace(/\\/g, '/').includes('/dist/')) {
        const target = new URL('./dist/index.html', location.href);
        document.write(`<style>#static-launcher{font:16px system-ui,sans-serif;max-width:34rem;margin:18vh auto;padding:2rem;color:#18395d;background:#f4f8fd;border-radius:16px;text-align:center}#static-launcher a{color:#126de8}</style><main id="static-launcher">正在打开已构建的网页版本。<br><a href="${target.href}">若未自动打开，请点此进入</a></main>`);
        location.replace(target);
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f8fd" />
    <link rel="preconnect" href="https://web.hycdn.cn" />
    <link rel="preload" href="/src/assets/fonts/OPPO-Sans-4.0.woff2" as="font" type="font/woff2" crossorigin />
    <title>塞壬唱片下载器</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript><main id="static-launcher">网页版本需要启用 JavaScript。<a href="./dist/index.html">打开构建后的页面</a></main></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
