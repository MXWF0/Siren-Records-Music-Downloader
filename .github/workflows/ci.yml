name: Cross-platform CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cross-platform/**'
      - '.github/workflows/*.yml'
  pull_request:
    paths:
      - 'cross-platform/**'
      - '.github/workflows/*.yml'

permissions:
  contents: read

concurrency:
  group: cross-platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cross-platform/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: cross-platform/src-tauri

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        working-directory: cross-platform
        run: npm ci

      - name: Test and build frontend
        working-directory: cross-platform
        run: npm run ci

      - name: Test and lint Rust backend
        working-directory: cross-platform/src-tauri
        run: |
          cargo test --locked
          cargo clippy --locked -- -D warnings
