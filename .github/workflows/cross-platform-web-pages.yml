name: Deploy cross-platform web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cross-platform/**'
      - '.github/workflows/cross-platform-web-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: cross-platform-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cross-platform/package-lock.json

      - name: Install dependencies
        working-directory: cross-platform
        run: npm ci

      - name: Validate external proxy configuration
        env:
          VITE_API_BASE_URL: ${{ vars.SIREN_API_BASE_URL }}
        shell: bash
        run: |
          if [[ ! "$VITE_API_BASE_URL" =~ ^https:// ]]; then
            echo "::error::Set the repository variable SIREN_API_BASE_URL to the HTTPS origin of the deployed /api proxy."
            exit 1
          fi

      - name: Test and build
        working-directory: cross-platform
        env:
          VITE_API_BASE_URL: ${{ vars.SIREN_API_BASE_URL }}
        run: npm run ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: cross-platform/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
