name: Deploy cross-platform web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'cross-platform/**'
      - '.github/workflows/cross-platform-web-pages.yml'
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cross-platform/package-lock.json

      - name: Install dependencies
        working-directory: cross-platform
        run: npm ci

      - name: Refresh signed URLs and build
        working-directory: cross-platform
        env:
          SIREN_REFRESH_SIGNED_URLS: '1'
          SIREN_REQUIRE_FRESH_CATALOG: '1'
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: cross-platform/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
